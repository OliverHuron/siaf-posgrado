<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d0d0d;font-family:'Courier New',monospace;overflow:hidden;color:#ddd;}
#header{position:fixed;top:0;left:0;right:0;z-index:200;height:46px;
  background:#080808;border-bottom:1px solid #1a1a1a;
  padding:0 16px;display:flex;justify-content:space-between;align-items:center;}
#header h1{color:#c4973a;font-size:11px;letter-spacing:3px;}
#header p{color:#444;font-size:8px;letter-spacing:2px;margin-top:2px;}
#hc{display:flex;gap:5px;align-items:center;}
.hbtn{background:transparent;border:1px solid #252525;color:#555;
  padding:4px 11px;font-family:'Courier New',monospace;font-size:9px;
  letter-spacing:1px;cursor:pointer;transition:all .15s;}
.hbtn:hover{border-color:#c4973a;color:#c4973a;}
.hbtn.on{border-color:#c4973a;color:#c4973a;background:#c4973a12;}
#canvas{position:fixed;top:46px;left:0;right:0;bottom:0;
  overflow:hidden;cursor:grab;background:#181818;}
#canvas:active{cursor:grabbing;}
#canvas svg{position:absolute;transform-origin:0 0;background:#fff;
  box-shadow:0 4px 60px rgba(0,0,0,.8);}
.wall{fill:#fff;}.line{fill:none;stroke:#111;}.symbol{fill:#fff;stroke:#111;}
.room-name{font-family:Arial,sans-serif;font-size:55px;font-weight:600;
  fill:#1a1a1a;text-anchor:middle;dominant-baseline:auto;}
.room-code{font-family:Arial,sans-serif;font-size:42px;font-weight:400;
  fill:#666;text-anchor:middle;dominant-baseline:auto;}
#hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
  color:#2a2a2a;font-size:9px;letter-spacing:2px;pointer-events:none;}
</style>
</head>

<script>
const cv=document.getElementById('canvas');
const FLOORS={baja:document.getElementById('svg-baja'),primera:document.getElementById('svg-primera'),segunda:document.getElementById('svg-segunda')};
let cur=FLOORS.baja,sc=0.1,tx=10,ty=10,dr=false,sx,sy,stx,sty;
const apT=()=>Object.values(FLOORS).forEach(s=>{if(s.style.display!=='none')s.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;});
function zm(f,cx,cy){
  cx=cx??cv.clientWidth/2;cy=cy??cv.clientHeight/2;
  const ns=Math.min(Math.max(sc*f,.02),10);
  tx=cx-(cx-tx)*(ns/sc);ty=cy-(cy-ty)*(ns/sc);sc=ns;apT();
}
function rv(){
  const w=parseFloat(cur.getAttribute('width')),h=parseFloat(cur.getAttribute('height'));
  sc=Math.min(cv.clientWidth/w,cv.clientHeight/h)*.92;
  tx=(cv.clientWidth-w*sc)/2;ty=(cv.clientHeight-h*sc)/2+4;apT();
}
function showFloor(which){
  Object.values(FLOORS).forEach(s=>s.style.display='none');
  FLOORS[which].style.display='';cur=FLOORS[which];
  document.querySelectorAll('.hbtn').forEach(b=>b.classList.remove('on'));
  document.getElementById('btn-'+which).classList.add('on');
  rv();
}
cv.addEventListener('mousedown',e=>{dr=true;sx=e.clientX;sy=e.clientY;stx=tx;sty=ty;});
cv.addEventListener('mousemove',e=>{if(!dr)return;tx=stx+e.clientX-sx;ty=sty+e.clientY-sy;apT();});
cv.addEventListener('mouseup',()=>dr=false);
cv.addEventListener('mouseleave',()=>dr=false);
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zm(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let ld=0;
cv.addEventListener('touchstart',e=>{
  if(e.touches.length===1){dr=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY;stx=tx;sty=ty;}
  else if(e.touches.length===2)ld=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&dr){tx=stx+e.touches[0].clientX-sx;ty=sty+e.touches[0].clientY-sy;apT();}
  else if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    zm(d/ld,(e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2);ld=d;
  }
},{passive:false});
cv.addEventListener('touchend',()=>dr=false);
rv();
</script>
